<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Anwar Ben Brahim — AI, Machine Learning and Cybersecurity">
  <defs>
    <linearGradient id="velvet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24062B"/>
      <stop offset="35%" stop-color="#4A0C45"/>
      <stop offset="65%" stop-color="#6E1253"/>
      <stop offset="100%" stop-color="#2B0620"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="45%" stop-color="#F6E7B4" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#F6E7B4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#F0D98C"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#8E1B5A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8E1B5A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#velvet)"/>
  <rect width="1000" height="260" fill="url(#glow)"/>

  <g opacity="0.16" stroke="#F6E7B4" stroke-width="0.7" fill="none">
    <path d="M-40 40 Q 250 -10 520 40 T 1040 40"/>
    <path d="M-40 70 Q 250 20 520 70 T 1040 70"/>
    <path d="M-40 190 Q 250 240 520 190 T 1040 190"/>
    <path d="M-40 220 Q 250 270 520 220 T 1040 220"/>
  </g>

  <path d="M0 2 H1000" stroke="url(#sheen)" stroke-width="3"/>
  <path d="M0 258 H1000" stroke="url(#sheen)" stroke-width="3"/>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="500" y="52" font-size="17" letter-spacing="9" textLength="320" lengthAdjust="spacingAndGlyphs" fill="#E9CE7A" opacity="0.92">ANWAR BEN BRAHIM</text>
    <rect x="392" y="66" width="216" height="1.6" fill="url(#gold)"/>
    <circle cx="372" cy="66.8" r="3.2" fill="#F0D98C"/>
    <circle cx="628" cy="66.8" r="3.2" fill="#F0D98C"/>

    <text x="500" y="140" font-size="52" font-weight="700" textLength="880" lengthAdjust="spacingAndGlyphs" fill="url(#gold)">AI · Machine Learning · Cybersecurity</text>

    <text x="500" y="186" font-size="19" font-style="italic" textLength="400" lengthAdjust="spacingAndGlyphs" fill="#F0DCEB" opacity="0.95">Building intelligent systems that keep networks safe</text>
  </g>

  <text x="500" y="228" font-family="'Courier New', monospace" font-size="14" letter-spacing="3" text-anchor="middle" textLength="415" lengthAdjust="spacingAndGlyphs" fill="#E9CE7A" opacity="0.75">COMPUTER ENGINEERING · ENIT · SYSCOM</text>
