<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Anwar Ben Brahim — AI, Machine Learning and Cybersecurity" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040911"/>
      <stop offset="0.6" stop-color="#0A1424"/>
      <stop offset="1" stop-color="#06222A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22D3EE" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF88"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- scanning line -->
  <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)">
    <animate attributeName="y" from="-60" to="320" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- shield + circuit motif on the right -->
  <g transform="translate(985 60)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M80 0 L150 26 V90 C150 140 115 175 80 195 C45 175 10 140 10 90 V26 Z"/>
    <path d="M80 30 L128 48 V90 C128 124 106 150 80 165 C54 150 32 124 32 90 V48 Z" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="62" y="82" width="36" height="30" rx="4"/>
    <path d="M68 82 V72 a12 12 0 0 1 24 0 V82"/>
    <circle cx="80" cy="97" r="3" fill="#39FF88" stroke="none"/>
  </g>
  <g stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M900 90 H985 M900 140 H995 M900 190 H985"/>
    <path d="M1135 120 H1200 M1145 170 H1200"/>
  </g>
  <g fill="#39FF88">
    <circle cx="900" cy="90" r="3"/><circle cx="900" cy="140" r="3"/><circle cx="900" cy="190" r="3"/>
    <circle cx="1135" cy="120" r="3"/><circle cx="1145" cy="170" r="3"/>
  </g>

  <!-- text -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">
    <text x="60" y="88" font-size="18" fill="#39FF88">anwar@enit:~$ <tspan fill="#8BA3B8">whoami</tspan></text>
    <text x="60" y="160" font-size="58" font-weight="700" fill="#E6F1FF" letter-spacing="1">Anwar Ben Brahim</text>
    <rect x="60" y="178" width="360" height="4" rx="2" fill="url(#accent)"/>
    <text x="60" y="222" font-size="22" fill="#22D3EE">AI · Machine Learning · Cybersecurity</text>
    <text x="60" y="262" font-size="16" fill="#8BA3B8">Engineering student @ ENIT — building AI for security</text>
    <rect x="60" y="275" width="11" height="20" fill="#39FF88">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#22D3EE" stroke-opacity="0.25"/>
</svg>
