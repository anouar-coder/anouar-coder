<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 256" width="800" height="256"
     role="img" aria-label="Terminal: whoami, focus, currently">
  <style>
    text {
      font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
      font-size: 14px;
      white-space: pre;
    }
    /* Base state is fully visible: if animations do not run, text stays legible.
       The animation only reveals it from faint -> full (terminal boot-up). */
    .ln { opacity: 1; animation: boot 420ms ease-out both; }
    @keyframes boot { from { opacity: 0.12; } to { opacity: 1; } }
    #cur { animation: blink 1.05s step-end infinite; animation-delay: 3380ms; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    #sheen { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-160px); }
      55%  { transform: translateX(800px); }
      100% { transform: translateX(800px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ln, #cur, #sheen { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="bar"><rect x="0" y="0" width="800" height="36"/></clipPath>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6E7B4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F6E7B4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F6E7B4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C0922"/>
      <stop offset="100%" stop-color="#120618"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="255" rx="12" fill="url(#velvet)" stroke="#4A0C45"/>
  <g clip-path="url(#bar)">
    <rect x="0" y="0" width="800" height="36" fill="#2A0620"/>
    <rect id="sheen" x="-160" y="0" width="150" height="36" fill="url(#sheenGrad)"/>
  </g>
  <line x1="0" y1="36" x2="800" y2="36" stroke="#4A0C45" stroke-width="1"/>

  <circle cx="22" cy="18" r="5" fill="#C77BA8" opacity="0.9"/>
  <circle cx="40" cy="18" r="5" fill="#F0D98C" opacity="0.9"/>
  <circle cx="58" cy="18" r="5" fill="#7FB685" opacity="0.9"/>
  <text x="400.0" y="22" text-anchor="middle" font-size="12" fill="#B99BB0">anwar@profile ~</text>

  <g>
    <text class="ln" x="28" y="66" fill="#F0D98C" xml:space="preserve" style="animation-delay:260ms"><tspan fill="#C77BA8">$</tspan><tspan> whoami</tspan></text>
    <text class="ln" x="28" y="90" fill="#D9C4DC" xml:space="preserve" style="animation-delay:780ms">Anwar Ben Brahim — final-year Computer Engineering @ ENIT</text>

    <text class="ln" x="28" y="138" fill="#F0D98C" xml:space="preserve" style="animation-delay:1300ms"><tspan fill="#C77BA8">$</tspan><tspan> focus</tspan></text>
    <text class="ln" x="28" y="162" fill="#D9C4DC" xml:space="preserve" style="animation-delay:1820ms">AI for cybersecurity · network anomaly &amp; intrusion detection · explainable AI</text>

    <text class="ln" x="28" y="210" fill="#F0D98C" xml:space="preserve" style="animation-delay:2340ms"><tspan fill="#C77BA8">$</tspan><tspan> currently</tspan></text>
    <text class="ln" x="28" y="234" fill="#D9C4DC" xml:space="preserve" style="animation-delay:2860ms">building an AI-driven MDR platform · open to internships &amp; research collaborations</text>
  </g>

  <rect id="cur" x="738" y="222" width="8" height="16" fill="#F0D98C"/>
</svg>
